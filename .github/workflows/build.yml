name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle 8.9 (services.gradle.org)
        run: |
          set -e
          cd /tmp
          for url in \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-8.9-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip" \
            "https://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip"
          do
            echo "try $url"
            if curl -fL --retry 3 --retry-delay 4 --connect-timeout 40 -o gradle-8.9-bin.zip "$url"; then
              if unzip -t gradle-8.9-bin.zip >/dev/null 2>&1; then
                echo "downloaded ok from $url"
                break
              fi
            fi
            rm -f gradle-8.9-bin.zip
          done
          test -f gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.9/bin/gradle -v
      - name: Download native libs
        run: |
          set -e
          mkdir -p app/libs
          download() {
            dest="$1"; shift
            for url in "$@"; do
              echo "try $url"
              if curl -fL --retry 2 --retry-delay 3 --connect-timeout 30 -o "$dest" "$url"; then
                if unzip -t "$dest" >/dev/null 2>&1; then
                  echo "ok $dest"; return 0
                fi
              fi
              rm -f "$dest"
            done
            return 1
          }
          if [ -f app/libs/hev-socks5-tunnel.aar ] && unzip -t app/libs/hev-socks5-tunnel.aar >/dev/null 2>&1; then
            echo "using committed hev-socks5-tunnel.aar"
          else
            HV="https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.3/hev-socks5-tunnel.aar"
            download app/libs/hev-socks5-tunnel.aar "$HV" "https://ghproxy.net/$HV"
          fi
          V2="https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.21/libv2ray.aar"
          download app/libs/libv2ray.aar "$V2" "https://ghproxy.net/$V2" "https://mirror.ghproxy.com/$V2"
          ls -lh app/libs/
      - name: Bump versionCode to run number
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "1.9.${{ github.run_number }}"/' app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts
      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VpEgs-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VpEgs v${{ github.run_number }}
          body: |
            versionCode=${{ github.run_number }}
            versionName=1.9.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
